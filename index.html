<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>BEASTBOUND: Blades of the Hollow March</title>
<style>
:root{
  --iron:#14121a; --iron2:#221d2b; --bone:#e8ddc6; --blood:#c2352f;
  --ember:#f0a538; --moss:#5f8f4e; --violet:#6a4a86;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:#0a0910;overflow:hidden;
  font-family:"Courier New",ui-monospace,monospace;color:var(--bone);
  touch-action:none;user-select:none;-webkit-user-select:none;}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block;
  box-shadow:0 0 0 2px #000, 0 0 40px rgba(194,53,47,.25);}
#pad{position:fixed;inset:0;pointer-events:none;z-index:5;}
.tbtn{position:absolute;pointer-events:auto;border-radius:50%;
  border:2px solid rgba(232,221,198,.35);background:rgba(20,18,26,.42);
  color:var(--bone);font:bold 14px "Courier New",monospace;
  display:flex;align-items:center;justify-content:center;backdrop-filter:blur(2px);}
.tbtn.on{background:rgba(240,165,56,.5);border-color:var(--ember);}
#stick{position:absolute;left:14px;bottom:14px;width:124px;height:124px;pointer-events:auto;
  border-radius:50%;border:2px solid rgba(232,221,198,.22);background:rgba(20,18,26,.3);}
#nub{position:absolute;left:38px;top:38px;width:48px;height:48px;border-radius:50%;
  background:rgba(232,221,198,.3);border:2px solid rgba(232,221,198,.5);}
#hint{position:fixed;left:0;right:0;bottom:2px;text-align:center;font-size:11px;
  color:rgba(232,221,198,.5);z-index:4;letter-spacing:1px;}
@media (pointer:fine){#pad{display:none}}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="480" height="270"></canvas></div>
<div id="pad">
  <div id="stick"><div id="nub"></div></div>
  <div class="tbtn" id="bA" style="right:18px;bottom:96px;width:66px;height:66px">ATK</div>
  <div class="tbtn" id="bB" style="right:92px;bottom:52px;width:62px;height:62px">RIDE</div>
  <div class="tbtn" id="bC" style="right:20px;bottom:22px;width:58px;height:58px">ART</div>
  <div class="tbtn" id="bD" style="right:96px;bottom:126px;width:56px;height:56px">BEAST</div>
</div>
<div id="hint">WASD move &middot; J attack &middot; K jump/ride &middot; L arte &middot; I beast/tandem</div>
<script>
"use strict";
/* ============================================================
   BEASTBOUND: Blades of the Hollow March
   Single-file arcade beat-em-up with a monster-bonding system.
   All art is drawn procedurally at runtime (no external assets).
   ============================================================ */

const W = 480, H = 270;
const GY0 = 176, GY1 = 250;              // walkable depth band (screen space)
const cv = document.getElementById('c');
const ctx = cv.getContext('2d', { alpha: false });
ctx.imageSmoothingEnabled = false;

/* ---------- fit to screen ---------- */
function fit() {
  const s = Math.max(1, Math.min(window.innerWidth / W, window.innerHeight / H));
  cv.style.width = Math.floor(W * s) + 'px';
  cv.style.height = Math.floor(H * s) + 'px';
}
window.addEventListener('resize', fit); fit();

/* ---------- tiny helpers ---------- */
const rnd = (a, b) => a + Math.random() * (b - a);
const irnd = (a, b) => Math.floor(rnd(a, b + 1));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const pick = a => a[Math.floor(Math.random() * a.length)];
const dist = (a, b) => Math.hypot(a.x - b.x, (a.y - b.y) * 1.6);
function hash(n) { n = Math.sin(n * 127.1) * 43758.5453; return n - Math.floor(n); }

function R(x, y, w, h, c) {
  ctx.fillStyle = c;
  ctx.fillRect(Math.round(x), Math.round(y), Math.max(1, Math.round(w)), Math.max(1, Math.round(h)));
}
function ellipse(x, y, rx, ry, c) {
  ctx.fillStyle = c; ctx.beginPath();
  ctx.ellipse(Math.round(x), Math.round(y), rx, ry, 0, 0, 6.2832); ctx.fill();
}
/* ---------- 5x7 bitmap font: crisp at every zoom, outlined for contrast ---------- */
const GLYPH = {
  'A': '01110,10001,10001,11111,10001,10001,10001', 'B': '11110,10001,10001,11110,10001,10001,11110',
  'C': '01110,10001,10000,10000,10000,10001,01110', 'D': '11110,10001,10001,10001,10001,10001,11110',
  'E': '11111,10000,10000,11110,10000,10000,11111', 'F': '11111,10000,10000,11110,10000,10000,10000',
  'G': '01110,10001,10000,10111,10001,10001,01111', 'H': '10001,10001,10001,11111,10001,10001,10001',
  'I': '11111,00100,00100,00100,00100,00100,11111', 'J': '00111,00010,00010,00010,00010,10010,01100',
  'K': '10001,10010,10100,11000,10100,10010,10001', 'L': '10000,10000,10000,10000,10000,10000,11111',
  'M': '10001,11011,10101,10101,10001,10001,10001', 'N': '10001,11001,10101,10011,10001,10001,10001',
  'O': '01110,10001,10001,10001,10001,10001,01110', 'P': '11110,10001,10001,11110,10000,10000,10000',
  'Q': '01110,10001,10001,10001,10101,10010,01101', 'R': '11110,10001,10001,11110,10100,10010,10001',
  'S': '01111,10000,10000,01110,00001,00001,11110', 'T': '11111,00100,00100,00100,00100,00100,00100',
  'U': '10001,10001,10001,10001,10001,10001,01110', 'V': '10001,10001,10001,10001,10001,01010,00100',
  'W': '10001,10001,10001,10101,10101,11011,10001', 'X': '10001,10001,01010,00100,01010,10001,10001',
  'Y': '10001,10001,01010,00100,00100,00100,00100', 'Z': '11111,00001,00010,00100,01000,10000,11111',
  '0': '01110,10001,10011,10101,11001,10001,01110', '1': '00100,01100,00100,00100,00100,00100,01110',
  '2': '01110,10001,00001,00010,00100,01000,11111', '3': '11111,00010,00100,00010,00001,10001,01110',
  '4': '00010,00110,01010,10010,11111,00010,00010', '5': '11111,10000,11110,00001,00001,10001,01110',
  '6': '00110,01000,10000,11110,10001,10001,01110', '7': '11111,00001,00010,00100,01000,01000,01000',
  '8': '01110,10001,10001,01110,10001,10001,01110', '9': '01110,10001,10001,01111,00001,00010,01100',
  ' ': '00000,00000,00000,00000,00000,00000,00000', '.': '00000,00000,00000,00000,00000,01100,01100',
  ',': '00000,00000,00000,00000,01100,01100,11000', ':': '00000,01100,01100,00000,01100,01100,00000',
  ';': '00000,01100,01100,00000,01100,01100,11000', '!': '00100,00100,00100,00100,00100,00000,00100',
  '?': '01110,10001,00001,00110,00100,00000,00100', '-': '00000,00000,00000,11111,00000,00000,00000',
  '+': '00000,00100,00100,11111,00100,00100,00000', '/': '00001,00010,00010,00100,01000,01000,10000',
  "'": '00100,00100,01000,00000,00000,00000,00000', '"': '01010,01010,00000,00000,00000,00000,00000',
  '(': '00010,00100,01000,01000,01000,00100,00010', ')': '01000,00100,00010,00010,00010,00100,01000',
  '[': '01110,01000,01000,01000,01000,01000,01110', ']': '01110,00010,00010,00010,00010,00010,01110',
  '<': '00010,00100,01000,10000,01000,00100,00010', '>': '01000,00100,00010,00001,00010,00100,01000',
  '%': '11001,11010,00010,00100,01000,01011,10011', '&': '01100,10010,10100,01000,10101,10010,01101',
  '*': '00000,10101,01110,11111,01110,10101,00000', '#': '01010,11111,01010,01010,11111,01010,00000',
  '=': '00000,00000,11111,00000,11111,00000,00000', '_': '00000,00000,00000,00000,00000,00000,11111',
  '|': '00100,00100,00100,00100,00100,00100,00100', 'x': '00000,10001,01010,00100,01010,10001,00000'
};
const CHARS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789 .,:;!?-+/'\"()[]<>%&*#=_|x";
const ATLAS = {};
function getAtlas(color, scale) {
  const key = color + '|' + scale;
  if (ATLAS[key]) return ATLAS[key];
  const cw = 7 * scale, ch = 9 * scale;
  const cn = document.createElement('canvas');
  cn.width = cw * CHARS.length; cn.height = ch;
  const g = cn.getContext('2d');
  for (let i = 0; i < CHARS.length; i++) {
    const rows = (GLYPH[CHARS[i]] || '').split(',');
    if (rows.length < 7) continue;
    const ox = i * cw + scale, oy = scale;
    g.fillStyle = '#000';
    for (let r = 0; r < 7; r++) for (let c = 0; c < 5; c++) if (rows[r][c] === '1')
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++)
        g.fillRect(ox + (c + dx) * scale, oy + (r + dy) * scale, scale, scale);
    g.fillStyle = color;
    for (let r = 0; r < 7; r++) for (let c = 0; c < 5; c++) if (rows[r][c] === '1')
      g.fillRect(ox + c * scale, oy + r * scale, scale, scale);
  }
  ATLAS[key] = cn; return cn;
}
function txtWidth(s, scale) { return String(s).length * 6 * scale; }
function drawTxt(s, x, y, color, scale, align, maxw) {
  s = String(s).toUpperCase();
  scale = Math.max(1, Math.min(5, scale | 0));
  if (maxw) while (scale > 1 && txtWidth(s, scale) > maxw) scale--;
  const w = txtWidth(s, scale);
  if (align === 'center') x -= w / 2; else if (align === 'right') x -= w;
  const at = getAtlas(color || '#e8ddc6', scale), cw = 7 * scale, ch = 9 * scale;
  x = Math.round(x); y = Math.round(y);
  for (let i = 0; i < s.length; i++) {
    const idx = CHARS.indexOf(s[i]);
    if (idx < 0) continue;
    ctx.drawImage(at, idx * cw, 0, cw, ch, x + i * 6 * scale - scale, y - scale, cw, ch);
  }
}
function sizeToScale(size) { size = size || 8; return size <= 10 ? 1 : size <= 17 ? 2 : size <= 25 ? 3 : 4; }
function text(s, x, y, c, size, align, maxw) { drawTxt(s, x, y, c || '#e8ddc6', sizeToScale(size), align, maxw); }
function textSh(s, x, y, c, size, align, maxw) { drawTxt(s, x, y, c || '#e8ddc6', sizeToScale(size), align, maxw); }

/* ---------- audio ---------- */
let AC = null;
function actx() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { } } return AC; }
function beep(f, d, type, vol, slide) {
  const a = actx(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type || 'square'; o.frequency.setValueAtTime(f, a.currentTime);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, slide), a.currentTime + d);
  g.gain.setValueAtTime((vol || .15), a.currentTime);
  g.gain.exponentialRampToValueAtTime(.0008, a.currentTime + d);
  o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime + d + .02);
}
function noise(d, vol) {
  const a = actx(); if (!a) return;
  const n = a.sampleRate * d, b = a.createBuffer(1, n, a.sampleRate), ch = b.getChannelData(0);
  for (let i = 0; i < n; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = a.createBufferSource(); s.buffer = b;
  const g = a.createGain(); g.gain.value = vol || .12;
  const f = a.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 1400;
  s.connect(f); f.connect(g); g.connect(a.destination); s.start();
}
const SFX = {
  hit() { beep(220, .08, 'square', .13, 90); noise(.08, .1); },
  crit() { beep(420, .16, 'sawtooth', .14, 110); noise(.14, .16); },
  swing() { noise(.05, .05); },
  jump() { beep(300, .12, 'square', .07, 620); },
  hurt() { beep(180, .18, 'sawtooth', .12, 70); },
  cast() { beep(520, .22, 'triangle', .1, 1200); },
  pick() { beep(880, .09, 'square', .1, 1320); },
  tame() { beep(660, .1, 'triangle', .12, 990); setTimeout(() => beep(990, .18, 'triangle', .12, 1480), 90); },
  die() { beep(140, .35, 'sawtooth', .13, 50); noise(.3, .12); },
  ui() { beep(700, .05, 'square', .08); },
  level() { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => beep(f, .16, 'triangle', .11), i * 80)); }
};

/* ---------- input ---------- */
const keys = {};
const IN = { x: 0, y: 0, a: 0, b: 0, c: 0, d: 0, pa: 0, pb: 0, pc: 0, pd: 0, enter: 0, penter: 0 };
addEventListener('keydown', e => {
  keys[e.code] = 1;
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  actx();
});
addEventListener('keyup', e => { keys[e.code] = 0; });

const touch = { x: 0, y: 0, a: 0, b: 0, c: 0, d: 0 };
(function () {
  const st = document.getElementById('stick'), nub = document.getElementById('nub');
  let id = null, cx = 0, cy = 0;
  const set = (dx, dy) => {
    const m = Math.hypot(dx, dy), lim = 40;
    if (m > lim) { dx = dx / m * lim; dy = dy / m * lim; }
    nub.style.left = (38 + dx) + 'px'; nub.style.top = (38 + dy) + 'px';
    touch.x = Math.abs(dx) > 8 ? clamp(dx / 34, -1, 1) : 0;
    touch.y = Math.abs(dy) > 8 ? clamp(dy / 34, -1, 1) : 0;
  };
  st.addEventListener('touchstart', e => {
    actx(); const t = e.changedTouches[0]; id = t.identifier;
    const r = st.getBoundingClientRect(); cx = r.left + r.width / 2; cy = r.top + r.height / 2;
    set(t.clientX - cx, t.clientY - cy); e.preventDefault();
  }, { passive: false });
  st.addEventListener('touchmove', e => {
    for (const t of e.changedTouches) if (t.identifier === id) set(t.clientX - cx, t.clientY - cy);
    e.preventDefault();
  }, { passive: false });
  const end = e => {
    for (const t of e.changedTouches) if (t.identifier === id) {
      id = null; touch.x = 0; touch.y = 0; nub.style.left = '38px'; nub.style.top = '38px';
    }
  };
  st.addEventListener('touchend', end); st.addEventListener('touchcancel', end);

  [['bA', 'a'], ['bB', 'b'], ['bC', 'c'], ['bD', 'd']].forEach(([el, k]) => {
    const n = document.getElementById(el);
    n.addEventListener('touchstart', e => { actx(); touch[k] = 1; n.classList.add('on'); e.preventDefault(); }, { passive: false });
    const up = e => { touch[k] = 0; n.classList.remove('on'); e.preventDefault(); };
    n.addEventListener('touchend', up, { passive: false });
    n.addEventListener('touchcancel', up, { passive: false });
  });
})();

function readInput() {
  IN.pa = IN.a; IN.pb = IN.b; IN.pc = IN.c; IN.pd = IN.d; IN.penter = IN.enter;
  let x = 0, y = 0;
  if (keys.ArrowLeft || keys.KeyA) x -= 1;
  if (keys.ArrowRight || keys.KeyD) x += 1;
  if (keys.ArrowUp || keys.KeyW) y -= 1;
  if (keys.ArrowDown || keys.KeyS) y += 1;
  IN.x = clamp(x + touch.x, -1, 1); IN.y = clamp(y + touch.y, -1, 1);
  IN.a = (keys.KeyJ || keys.Space || touch.a) ? 1 : 0;
  IN.b = (keys.KeyK || touch.b) ? 1 : 0;
  IN.c = (keys.KeyL || touch.c) ? 1 : 0;
  IN.d = (keys.KeyI || touch.d) ? 1 : 0;
  IN.enter = (keys.Enter || keys.NumpadEnter) ? 1 : 0;
}
const tapA = () => IN.a && !IN.pa, tapB = () => IN.b && !IN.pb;
const tapC = () => IN.c && !IN.pc, tapD = () => IN.d && !IN.pd;
const tapAny = () => (IN.a && !IN.pa) || (IN.enter && !IN.penter) || (IN.b && !IN.pb);

/* ============================================================
   PROCEDURAL PIXEL SPRITES
   Every fighter is assembled from rectangles so the whole game
   stays in one file. TINT drives the red "hurt" silhouette that
   classic sprite sheets use.
   ============================================================ */
let TINT = null;
function q(x, y, w, h, c) { R(x, y, w, h, TINT || c); }

function shadow(x, y, r, a) {
  ctx.globalAlpha = a === undefined ? .32 : a;
  ellipse(x, y, r, Math.max(2, r * .38), '#000'); ctx.globalAlpha = 1;
}

/* weapon drawn from the fist position (fx,fy), pointing +x */
function drawWeapon(kind, fx, fy, ang, pal, t) {
  ctx.save(); ctx.translate(fx, fy); ctx.rotate(ang);
  const st = pal.steel || '#cfd6e2', wd = pal.wood || '#6b4a2f', gl = pal.glow || '#9fd8ff';
  switch (kind) {
    case 'katana': q(0, -1, 16, 2, st); q(15, -1, 3, 1, '#fff'); q(-3, -1, 4, 3, wd); break;
    case 'sword': q(0, -2, 14, 4, st); q(13, -2, 3, 4, '#eef3ff'); q(-4, -3, 4, 6, wd); q(-1, -4, 2, 8, '#8a6a3a'); break;
    case 'saber': q(0, -1, 15, 2, gl); q(0, -2, 15, 1, '#fff'); q(-4, -2, 4, 4, '#3a3a44'); break;
    case 'axe': q(-3, -1, 12, 2, wd); q(9, -6, 5, 12, st); q(9, -6, 2, 12, '#9aa4b4'); break;
    case 'club': q(-2, -1, 9, 3, wd); q(7, -5, 8, 10, '#7b5a3a'); q(9, -4, 2, 2, '#4a3423'); break;
    case 'spear': q(-6, -1, 20, 2, wd); q(14, -3, 7, 5, st); break;
    case 'dagger': q(0, -1, 7, 2, st); q(-3, -2, 3, 4, wd); break;
    case 'gun': q(0, -2, 8, 4, '#3b3b46'); q(2, 1, 3, 4, '#2a2a33'); if (t > 0) { q(8, -3, 6, 6, '#ffd66b'); q(11, -2, 6, 4, '#fff2c2'); } break;
    case 'staff': q(-4, -1, 3, 22, wd); q(-6, -6, 7, 6, gl); q(-4, -4, 3, 2, '#fff'); break;
    case 'whip': for (let i = 0; i < 7; i++) q(i * 3, Math.sin(i * .9 + t) * 3, 3, 1, '#8a5a3a'); break;
    case 'bomb': q(2, -3, 7, 7, '#2b2b33'); q(6, -6, 2, 3, '#8a7a5a'); q(7, -8, 2, 2, '#ffcf6b'); break;
    case 'claw': for (let i = 0; i < 3; i++) q(2, -3 + i * 3, 7, 1, '#e8e2d0'); break;
    default: break;
  }
  ctx.restore();
}

/* ------- humanoid ------- */
function drawBiped(e, t) {
  const P = e.pal, h = e.h, w = h * .46;
  const st = e.state, ph = e.aph || 0;
  let bob = 0, lean = 0, legF = 0, legB = 0, armF = 0, armFy = 0, armB = 0, wAng = -.3, wT = 0;

  if (st === 'walk') { legF = Math.sin(ph) * w * .34; legB = -legF; bob = Math.abs(Math.sin(ph)) * -1.1; armF = -legF * .6; armB = -legB * .6; }
  else if (st === 'run') { legF = Math.sin(ph) * w * .5; legB = -legF; bob = Math.abs(Math.sin(ph)) * -2; lean = 1.6; armF = -legF; armB = -legB; }
  else if (st === 'idle') { bob = Math.sin(ph * .5) * .7; armF = Math.sin(ph * .5) * .5; }
  else if (st === 'atk') {
    const k = e.atkT / Math.max(.001, e.atkDur);
    lean = k < .45 ? -2.5 + k * 6 : 4.2; armF = k < .45 ? -3 : 6; armFy = k < .45 ? -3 : 1;
    wAng = k < .45 ? -2.1 : (e.combo === 2 ? 1.1 : .35); wT = k > .45 ? 1 : 0;
    legF = 3; legB = -3;
  } else if (st === 'cast') {
    const k = e.atkT / Math.max(.001, e.atkDur);
    lean = -1.5; armF = 2 + k * 3; armFy = -6 - k * 2; wAng = -1.5 + k * .6; bob = -1;
  } else if (st === 'jump') { legF = 2; legB = -4; bob = -1; armF = -2; armFy = -3; wAng = -1.2; }
  else if (st === 'hurt') { lean = -4; legF = -3; legB = 2; armF = -4; armFy = -3; }
  else if (st === 'down') {
    ctx.save(); ctx.rotate(-1.35); ctx.translate(-h * .5, -h * .18);
  }

  const flip = e.face < 0 ? -1 : 1;
  ctx.save(); ctx.scale(flip, 1);

  const bt = -h + bob;                       // top of head area baseline offset
  const hipY = bt + h * .52, shY = bt + h * .30;

  /* back arm */
  q(-w * .1 + armB * .5 + lean * .4, shY, w * .26, h * .26, P.arm2 || P.body2);
  /* cape / robe back */
  if (e.build && e.build.cape) {
    ctx.globalAlpha = .95;
    q(-w * .55 + lean * .3, shY - 1, w * .5, h * .58 + Math.sin(t * 4) * 1.2, P.cape);
    ctx.globalAlpha = 1;
  }
  /* legs */
  if (e.build && e.build.robe) {
    q(-w * .46 + lean * .2, hipY, w * .95, h * .5, P.robe || P.body);
    q(-w * .46 + lean * .2, hipY + h * .38, w * .95, h * .12, P.robe2 || P.body2);
  } else {
    q(-w * .32 + legB + lean * .2, hipY, w * .28, h * .48, P.pants2 || P.pants);
    q(w * .02 + legF + lean * .2, hipY, w * .28, h * .48, P.pants);
    q(-w * .34 + legB + lean * .2, hipY + h * .42, w * .32, h * .07, P.boot || '#3a2a1e');
    q(w * .0 + legF + lean * .2, hipY + h * .42, w * .32, h * .07, P.boot || '#3a2a1e');
  }
  /* torso */
  q(-w * .4 + lean * .35, shY - 1, w * .8, h * .26, P.body);
  q(-w * .4 + lean * .35, shY + h * .16, w * .8, h * .08, P.body2 || P.body);
  if (e.build && e.build.sash) q(-w * .4 + lean * .35, shY + h * .19, w * .8, h * .05, P.sash || '#c2352f');
  /* head */
  const hx = -w * .27 + lean * .5, hy = bt + h * .06;
  q(hx, hy, w * .55, h * .25, P.skin);
  if (e.build && e.build.muzzle) q(hx + w * .5, hy + h * .1, w * .3, h * .1, P.skin2 || P.skin);
  if (e.build && e.build.hood) { q(hx - 1, hy - 2, w * .62, h * .16, P.hood || P.cape); q(hx - 2, hy + h * .04, w * .2, h * .2, P.hood || P.cape); }
  else if (e.build && e.build.hair) { q(hx - 1, hy - 2, w * .6, h * .1, P.hair); q(hx - 3, hy, w * .18, h * .3, P.hair); }
  if (e.build && e.build.hat) { q(hx - 4, hy - 1, w * .95, h * .05, P.hat); q(hx + w * .05, hy - h * .13, w * .38, h * .14, P.hat); }
  if (e.build && e.build.horn) { q(hx + w * .05, hy - h * .12, 2, h * .13, P.horn || '#e8ddc6'); q(hx + w * .38, hy - h * .12, 2, h * .13, P.horn || '#e8ddc6'); }
  /* eye */
  if (!TINT) { q(hx + w * .34, hy + h * .1, 2, 2, P.eye || '#141018'); }
  /* front arm + weapon */
  const fax = w * .22 + armF + lean * .5, fay = shY + armFy;
  q(fax - w * .06, fay, w * .26, h * .26, P.arm || P.body);
  if (e.wep && e.wep !== 'none') drawWeapon(e.wep, fax + w * .16, fay + h * .2, wAng, P, wT);
  /* tail / wings */
  if (e.build && e.build.tail) q(-w * .5 - 3, hipY + 2, w * .5, 3, P.hair || P.body2);
  ctx.restore();
  if (st === 'down') ctx.restore();
}

/* ------- slime / blob ------- */
function drawBlob(e, t) {
  const P = e.pal, h = e.h;
  const sq = e.state === 'atk' ? 1 + Math.sin(e.atkT * 14) * .28 : 1 + Math.sin(t * 3 + (e.seed || 0)) * .07;
  const rw = h * .62 / sq, rh = h * .48 * sq;
  ctx.fillStyle = TINT || P.body;
  ctx.beginPath(); ctx.ellipse(0, -rh, rw, rh, 0, 0, 6.2832); ctx.fill();
  ctx.fillStyle = TINT || (P.body2 || P.body);
  ctx.beginPath(); ctx.ellipse(-rw * .2, -rh * .6, rw * .5, rh * .45, 0, 0, 6.2832); ctx.fill();
  if (!TINT) {
    q(rw * .1 * e.face, -rh * 1.05, 2, 2, '#1c1c22');
    q(rw * .45 * e.face, -rh * 1.05, 2, 2, '#1c1c22');
    q(-rw * .5, -rh * 1.3, rw * .45, rh * .3, 'rgba(255,255,255,.35)');
  }
  if (e.build && e.build.crown) { q(-3, -rh * 2 - 3, 8, 3, '#ffd66b'); q(-3, -rh * 2 - 6, 2, 3, '#ffd66b'); q(3, -rh * 2 - 6, 2, 3, '#ffd66b'); }
}

/* ------- quadruped (wolves, chupacabra, bears) ------- */
function drawQuad(e, t) {
  const P = e.pal, h = e.h, L = h * 1.25;
  const ph = e.aph || 0, mv = (e.state === 'walk' || e.state === 'run') ? Math.sin(ph) * 3 : 0;
  const lunge = e.state === 'atk' ? clamp(e.atkT * 20, 0, 5) : 0;
  ctx.save(); ctx.scale(e.face < 0 ? -1 : 1, 1);
  const by = -h * .62;
  q(-L * .4, by - 2, L * .8, h * .38, P.body);                     // body
  q(-L * .4, by + h * .2, L * .8, h * .12, P.body2 || P.body);     // belly shade
  q(-L * .42 + mv, by + h * .3, 4, h * .34, P.body2 || P.body);    // legs
  q(-L * .22 - mv, by + h * .3, 4, h * .34, P.body);
  q(L * .12 + mv, by + h * .3, 4, h * .34, P.body2 || P.body);
  q(L * .3 - mv, by + h * .3, 4, h * .34, P.body);
  q(L * .3 + lunge, by - h * .22, h * .42, h * .34, P.body);       // head
  q(L * .3 + lunge + h * .3, by - h * .06, h * .3, h * .16, P.skin2 || P.body2 || P.body); // snout
  q(L * .34 + lunge, by - h * .34, 3, 5, P.body);                  // ears
  q(L * .5 + lunge, by - h * .34, 3, 5, P.body);
  q(-L * .48, by - h * .04, h * .3, 3, P.body2 || P.body);         // tail
  if (!TINT) {
    q(L * .48 + lunge, by - h * .12, 2, 2, P.eye || '#ff5a3c');
    if (e.build && e.build.fangs) { q(L * .58 + lunge, by + h * .06, 2, 3, '#fff'); q(L * .68 + lunge, by + h * .06, 2, 3, '#fff'); }
    if (e.build && e.build.spines) for (let i = 0; i < 4; i++) q(-L * .3 + i * 7, by - 5, 2, 4, P.spine || '#3a2a3a');
  }
  ctx.restore();
}

/* ------- winged (fairies, pixies, dragons, cryptids) ------- */
function drawWinged(e, t) {
  const P = e.pal, h = e.h, flap = Math.sin(t * (e.big ? 6 : 16) + (e.seed || 0)) * (e.big ? 5 : 4);
  ctx.save(); ctx.scale(e.face < 0 ? -1 : 1, 1);
  const by = -h * .78;
  ctx.globalAlpha = e.big ? 1 : .8;
  q(-h * .58, by - flap, h * .5, h * .34, P.wing || '#cfe7ff');
  q(h * .1, by - flap * .7, h * .5, h * .3, P.wing || '#cfe7ff');
  ctx.globalAlpha = 1;
  if (e.big) {
    q(-h * .34, by, h * .78, h * .38, P.body);
    q(-h * .34, by + h * .26, h * .78, h * .12, P.body2 || P.body);
    q(h * .34, by - h * .18, h * .36, h * .3, P.body);              // head
    q(h * .62, by - h * .06, h * .22, h * .12, P.body2 || P.body);  // snout
    q(h * .38, by - h * .32, 3, 6, P.horn || '#e8ddc6');
    q(-h * .5, by + h * .04, h * .3, 3, P.body2 || P.body);         // tail
    q(-h * .2, by + h * .3, 4, h * .22, P.body2 || P.body);
    q(h * .16, by + h * .3, 4, h * .22, P.body);
    if (!TINT) q(h * .6, by - h * .12, 2, 2, P.eye || '#ffd23c');
    if (e.state === 'cast' && !TINT) { const g = h * .2 + Math.sin(t * 20) * 2; ellipse(h * .86, by + h * .02, g, g * .7, P.glow || '#ff8a3c'); }
  } else {
    q(-h * .16, by + h * .1, h * .32, h * .34, P.body);
    q(-h * .14, by - h * .1, h * .3, h * .22, P.skin || '#ffdcc0');
    q(-h * .18, by - h * .18, h * .38, h * .1, P.hair || '#ffe27a');
    if (!TINT) q(h * .04, by - h * .04, 2, 2, '#141018');
    if (!TINT) { ctx.globalAlpha = .5; ellipse(0, by, h * .5, h * .5, P.glow || 'rgba(255,230,150,.5)'); ctx.globalAlpha = 1; }
  }
  ctx.restore();
}

/* ------- treant ------- */
function drawTree(e, t) {
  const P = e.pal, h = e.h, sway = Math.sin(t * 1.6 + (e.seed || 0)) * 2;
  ctx.save(); ctx.scale(e.face < 0 ? -1 : 1, 1);
  q(-h * .2, -h * .5, h * .4, h * .5, P.body);
  q(-h * .3, -h * .1, h * .12, h * .1, P.body2 || P.body);
  q(h * .18, -h * .1, h * .12, h * .1, P.body2 || P.body);
  q(-h * .3 + sway, -h * .82, h * .6, h * .34, P.body2 || P.body);
  const swing = e.state === 'atk' ? clamp(e.atkT * 24, 0, 8) : 0;
  q(h * .26 + swing, -h * .74, h * .34, h * .1, P.body);
  q(-h * .56 + sway * .5, -h * .72, h * .3, h * .1, P.body);
  ctx.globalAlpha = .95;
  ellipse(sway, -h * .92, h * .52, h * .3, P.leaf || '#3f6b34');
  ellipse(-h * .3 + sway, -h * .84, h * .3, h * .2, P.leaf2 || '#54843f');
  ellipse(h * .32 + sway, -h * .86, h * .28, h * .2, P.leaf2 || '#54843f');
  ctx.globalAlpha = 1;
  if (!TINT) { q(-h * .1 + sway, -h * .68, 3, 3, '#ffcf3c'); q(h * .1 + sway, -h * .68, 3, 3, '#ffcf3c'); }
  ctx.restore();
}

/* ------- floaters (greys, mothman-ish cryptids) ------- */
function drawFloat(e, t) {
  const P = e.pal, h = e.h, hov = Math.sin(t * 3 + (e.seed || 0)) * 2;
  ctx.save(); ctx.scale(e.face < 0 ? -1 : 1, 1); ctx.translate(0, hov);
  q(-h * .18, -h * .62, h * .36, h * .38, P.body);
  q(-h * .3, -h * .5, h * .14, h * .3, P.body2 || P.body);
  q(h * .16, -h * .5, h * .14, h * .3, P.body2 || P.body);
  q(-h * .12, -h * .24, h * .1, h * .24, P.body2 || P.body);
  q(h * .04, -h * .24, h * .1, h * .24, P.body2 || P.body);
  q(-h * .24, -h * .92, h * .48, h * .32, P.skin || P.body);
  if (!TINT) {
    q(-h * .16, -h * .8, h * .14, h * .1, P.eye || '#0b0b10');
    q(h * .04, -h * .8, h * .14, h * .1, P.eye || '#0b0b10');
    if (e.build && e.build.aura) { ctx.globalAlpha = .25; ellipse(0, -h * .5, h * .7, h * .7, P.glow || '#7ef0c2'); ctx.globalAlpha = 1; }
  }
  ctx.restore();
}

const RENDERERS = { biped: drawBiped, blob: drawBlob, quad: drawQuad, wing: drawWinged, tree: drawTree, float: drawFloat };

function drawActor(e, t) {
  if (e.isProp) {
    shadow(e.x - camX, e.y, 9, .3);
    ctx.save(); ctx.translate(Math.round(e.x - camX), Math.round(e.y)); drawProp(e); ctx.restore();
    return;
  }
  const sy = e.y - e.z;
  shadow(e.x - camX, e.y, Math.max(4, e.h * .34), .3 - clamp(e.z / 90, 0, .2));
  ctx.save(); ctx.translate(Math.round(e.x - camX), Math.round(sy));
  if (e.flash > 0 && Math.floor(e.flash * 30) % 2 === 0) TINT = '#ff4a4a';
  if (e.dying) { ctx.globalAlpha = clamp(e.dying, 0, 1); }
  (RENDERERS[e.render] || drawBiped)(e, t);
  TINT = null; ctx.globalAlpha = 1; ctx.restore();
}

function compMaxHP(key, lvl) {

  return Math.round((b.hp * 3.1 + 55) * keeper * (1 + (lvl - 1) * .22));

  return { key: key, lvl: 1, xp: 0, hp: mx, maxhp: mx, down: 0 };

function bondXP(slot, n) {
  slot.xp += n;
  const need = 30 + slot.lvl * 26;
  if (slot.xp >= need) {
    slot.xp -= need; slot.lvl++;
    slot.maxhp = compMaxHP(slot.key, slot.lvl); slot.hp = slot.maxhp;
    if (companion && companion.slot === slot) {
      companion.maxhp = slot.maxhp; companion.hp = slot.hp;
      companion.atk = Math.round(BEAST[slot.key].atk * 1.15 + slot.lvl * 2.2);
      addText(companion.x, companion.y - 40, 'BOND UP! Lv' + slot.lvl, '#7ef0c2', 1);

}
function summon(i) {
  if (!roster.length) return;
  selRoster = ((i % roster.length) + roster.length) % roster.length;
  const s = roster[selRoster];
  if (s.hp <= 0) s.hp = Math.max(1, Math.round(s.maxhp * .55));
  companion = mkCompanion(s);
  burst(companion.x, companion.y, 8, 16, '#7ef0c2', 60, 'spark');
  SFX.tame();
}

  bomb: { spd: 120, dmg: 1.5, r: 5, c: '#2b2b33', arc: 1, boom: 1 },

function fire(src, kind, tx, ty, dmg, owner) {
  const d = PROJ[kind]; if (!d) return;
  const dx = tx - src.x, dy = ty - (src.y - src.z * .5), m = Math.hypot(dx, dy) || 1;
  projs.push({
    kind: kind, x: src.x + src.face * 8, y: src.y, z: src.z + src.h * .55,
    vx: dx / m * d.spd, vy: dy / m * d.spd * .55,
    vz: d.arc ? 60 : ((14 - (src.z + src.h * .55)) / Math.max(.12, m / d.spd)),
    dmg: dmg, owner: owner, life: 2.4, t: 0, r: d.r, c: d.c, arc: d.arc || 0, boom: d.boom || 0, pull: d.pull || 0
  });
  SFX.cast();
}

/* ---------- damage ---------- */
function hurtEnemy(e, dmg, kx, from, crit) {
  if (e.dying) return;
  if (e.armor) { dmg *= .74; kx *= .45; }
  e.hp -= dmg; e.flash = .18; e.stun = crit ? .42 : .22;
  e.kbx = kx * (e.boss ? .25 : 1); e.state = 'hurt'; e.hurtT = .22;
  addText(e.x, e.y - e.h - 8, Math.round(dmg), crit ? '#ffd23c' : '#fff2c2', crit ? 1 : 0);
  burst(e.x, e.y - e.h * .5, 0, crit ? 10 : 5, '#ff9a5a', 55, 'spark');
  if (from === 'player') bondG = Math.min(BOND_MAX, bondG + (crit ? 4.2 : 2.6));
  else if (from === 'companion') bondG = Math.min(BOND_MAX, bondG + 1.8);
  hitstop = Math.max(hitstop, crit ? .07 : .04); shake = Math.max(shake, crit ? 4 : 2);
  crit ? SFX.crit() : SFX.hit();
  if (e.hp <= 0) killEnemy(e, from);
}
function killEnemy(e, from) {
  e.dying = 1; e.state = 'down'; e.hp = 0;
  score += e.xp * 12; SFX.die();
  burst(e.x, e.y - e.h * .5, 0, 14, e.pal.body || '#c2352f', 70, 'dot');
  if (from === 'player' || from === 'companion') {
    player.xp += e.xp;

    while (player.xp >= player.next) {

  /* drops */
  const r = Math.random();

  if (BEAST[e.key].tame) {

    else if (r < chance + .16) drops.push({ kind: 'meat', x: e.x, y: e.y, z: 8, vz: 40, t: 0 });

}
function hurtPlayer(dmg) {

function playerHit() {
  const p = player, third = p.combo === 2, ride = p.riding && companion ? 1 : 0, jumpAtk = p.z > 4 && !ride;
  const reach = p.reach + (third ? 8 : 0) + (ride ? 14 : 0);
  const dmg = (p.atk + (ride ? companion.atk * .75 : 0)) * (third ? 2.0 : jumpAtk ? 1.9 : 1) * rnd(.92, 1.12);
  if (ride) { companion.state = 'atk'; companion.atkT = .2; companion.hitDone = 1; }
  props.forEach(o => {
    if (o.dead) return;
    const dx = (o.x - p.x) * p.face;
    if (dx > -14 && dx < reach + 8 && Math.abs(o.y - p.y) < 20) breakProp(o);
  });
  let hits = 0;
  enemies.forEach(e => {
    if (e.dying) return;
    const dx = (e.x - p.x) * p.face, dy = Math.abs(e.y - p.y);
    if (dx > -10 && dx < reach && dy < 18) {
      hurtEnemy(e, dmg, p.face * (third ? 170 : 70), 'player', third || jumpAtk);
      if (third || jumpAtk) { e.vz = 90; e.z = Math.max(e.z, 1); }
      hits++;
    }
  });
  if (p.def.ranged && !hits && !jumpAtk) {
    fire(p, p.key === 'nightmage' ? 'pbolt' : 'pshot', p.x + p.face * 200, p.y, p.atk * 1.15, 'p');
  }
  if (hits) { combo++; comboT = 2.2; score += hits * 5; } else SFX.swing();
}

function updPlayer(d) {
  const p = player;
  p.flash = Math.max(0, p.flash - d); p.iframe = Math.max(0, p.iframe - d);
  if (p.dying) { p.state = 'down'; return; }
  if (p.hurtT > 0) { p.hurtT -= d; p.state = 'hurt'; p.x -= p.face * 26 * d; }
  else if (p.atkT > 0) {
    p.atkT -= d;
    if (!p.hitDone && p.atkT < p.atkDur * .55) { p.hitDone = 1; playerHit(); }
    if (p.atkT <= 0) { p.state = p.z > 0 ? 'jump' : 'idle'; p.comboWin = .34; }
  } else {
    /* movement */
    let mx = IN.x, my = IN.y;
    const sp = (p.riding && companion ? companion.spd * 1.25 + .5 : p.spd) * 74 * (p.z > 0 && !p.riding ? .8 : 1);
    if (mx || my) {
      const m = Math.hypot(mx, my) || 1;
      p.x += mx / m * sp * d; p.y += my / m * sp * .58 * d;
      if (mx) p.face = mx > 0 ? 1 : -1;
      p.state = p.z > 0 ? 'jump' : (Math.abs(mx) > .7 ? 'run' : 'walk');
      p.aph += d * (p.state === 'run' ? 16 : 11);
    } else if (p.z <= 0) { p.state = 'idle'; p.aph += d * 4; }
    /* mount / dismount / jump */
    if (tapB()) {
      if (p.riding) dismount(1);
      else if (companion && !companion.dying && Math.abs(companion.x - p.x) < 24 && Math.abs(companion.y - p.y) < 18 && p.z <= 0) mount();
      else if (p.z <= 0) { p.vz = 150; p.z = 1; p.state = 'jump'; SFX.jump(); }
    }
    /* attack */
    if (tapA()) {
      p.combo = p.comboWin > 0 ? (p.combo + 1) % 3 : 0;
      p.atkDur = p.combo === 2 ? .34 : .24; p.atkT = p.atkDur; p.hitDone = 0;
      p.state = p.z > 4 ? 'atk' : 'atk'; p.comboWin = 0; SFX.swing();
    }
    /* arte */
    if (tapC() && p.mp >= p.def.arteCost) {
      p.mp -= p.def.arteCost; p.state = 'cast'; p.atkT = .34; p.atkDur = .34; p.hitDone = 1;
      ARTE[p.def.arte](p); SFX.cast();
      addText(p.x, p.y - 52, p.def.arteName, '#8fc4ff', 1);
    }
  }
  p.comboWin = Math.max(0, p.comboWin - d);
  /* gravity */
  if (!p.riding && (p.z > 0 || p.vz !== 0)) { p.vz -= 430 * d; p.z += p.vz * d; if (p.z <= 0) { p.z = 0; p.vz = 0; if (p.state === 'jump') p.state = 'idle'; } }
  /* bounds */
  p.y = clamp(p.y, GY0, GY1);
  const lo = gateLocked ? camX + 8 : 8, hi = gateLocked ? camX + W - 14 : STAGES[stageIdx].len - 20;
  p.x = clamp(p.x, lo, hi);
  /* saddle sync */
  if (p.riding) {
    if (!companion || companion.dying) dismount(0);
    else {
      companion.x = p.x; companion.y = p.y; companion.face = p.face;
      const moving = Math.abs(IN.x) + Math.abs(IN.y) > .1;
      companion.state = moving ? 'run' : 'idle'; companion.aph += d * (moving ? 17 : 4);
      p.z = companion.h * .66;
      if (moving && Math.random() < .35) parts.push({ x: p.x - p.face * 8, y: p.y, z: 2, vx: -p.face * 30, vy: 0, vz: rnd(8, 26), life: .3, t: 0, c: 'rgba(220,210,190,.8)', s: 2, kind: 'dot' });
    }
  }
  /* regen a trickle of arte energy */
  p.mp = Math.min(p.maxmp, p.mp + d * 2.6);
  /* pickups */
  drops.forEach(o => {
    if (o.dead) return;
    if (Math.abs(o.x - p.x) < 16 && Math.abs(o.y - p.y) < 14 && o.z < 14) {
      o.dead = 1; SFX.pick();
      if (o.kind === 'meat') { p.hp = Math.min(p.maxhp, p.hp + 34); addText(p.x, p.y - 46, '+34 HP', '#7ef0c2'); }
      else if (o.kind === 'flask') { p.mp = Math.min(p.maxmp, p.mp + 32); addText(p.x, p.y - 46, '+32 ARTE', '#8fc4ff'); }
      else if (o.kind === 'coin') { p.gold += 25; score += 60; }
      else if (o.kind === 'orb') {
        const have = roster.find(s => s.key === o.key);
        if (have) { bondXP(have, 26); addText(p.x, p.y - 50, BEAST[o.key].name + ' BOND +', '#7ef0c2'); }
        else if (roster.length < 8) {
          const s = rosterSlot(o.key); roster.push(s);
          addText(p.x, p.y - 52, BEAST[o.key].name + ' BONDED!', '#ffd23c', 1);
          burst(p.x, p.y - 20, 10, 22, '#ffd23c', 70, 'spark'); SFX.tame();
          if (!companion) summon(roster.length - 1);
        } else addText(p.x, p.y - 50, 'ROSTER FULL', '#ff9a5a');
      }
    }
  });
}

function updCompanion(d) {
  if (!companion) return;
  const c = companion, p = player;
  c.flash = Math.max(0, c.flash - d);
  c.slot.hp = c.hp;
  /* passives */
  if (c.key === 'fairy') { c.heal += d; if (c.heal > 1.4) { c.heal = 0; if (p.hp < p.maxhp) { p.hp = Math.min(p.maxhp, p.hp + 2); burst(p.x, p.y - 20, 8, 2, '#7ef0c2', 20, 'spark'); } } }
  if (c.key === 'pixie') { c.heal += d; if (c.heal > 1.2) { c.heal = 0; p.mp = Math.min(p.maxmp, p.mp + 3); } }
  p.lifesteal = c.key === 'vampire' ? 6 : 0;

  let tgt = null, bd = 1e9;
  enemies.forEach(e => { if (e.dying) return; const dd = dist(c, e); if (dd < bd && Math.abs(e.x - p.x) < 190) { bd = dd; tgt = e; } });

  if (c.atkT > 0) {
    c.atkT -= d;
    if (!c.hitDone && c.atkT < c.atkDur * .5) {
      c.hitDone = 1;
      const mult = c.rush > 0 ? 2.2 : 1;
      if (c.proj && (c.ai === 'ranged' || c.ai === 'flyer')) { if (tgt) fire(c, c.proj, tgt.x, tgt.y, c.atk * mult, 'p'); }
      else enemies.forEach(e => {
        if (!e.dying && Math.abs(e.x - c.x) < c.reach + 6 && Math.abs(e.y - c.y) < 20)
          hurtEnemy(e, c.atk * mult * rnd(.9, 1.1), Math.sign(e.x - c.x) * 70 * mult, 'companion', c.rush > 0);
      });
      if (c.key === 'trent' || c.key === 'slime') enemies.forEach(e => { if (Math.abs(e.x - c.x) < 34) e.stun = Math.max(e.stun, .5); });
    }
    if (c.atkT <= 0) { c.state = 'idle'; c.rush = Math.max(0, c.rush - .4); }
  } else if (tgt && bd < 150) {
    const dx = tgt.x - c.x, dy = tgt.y - c.y;
    const near = c.ai === 'ranged' || c.ai === 'flyer' ? 70 : c.reach - 4;
    if (Math.abs(dx) > near || Math.abs(dy) > 12) {
      const sp = c.spd * 78 * (c.rush > 0 ? 2 : 1);
      c.x += Math.sign(dx) * sp * d; c.y += clamp(dy, -1, 1) * sp * .55 * d;
      c.face = dx > 0 ? 1 : -1; c.state = c.rush > 0 ? 'run' : 'walk'; c.aph += d * 13;
    } else if (c.cd <= 0) { c.state = 'atk'; c.atkT = c.atkDur; c.hitDone = 0; c.cd = c.rush > 0 ? .3 : rnd(.6, 1.1); c.face = dx > 0 ? 1 : -1; }
    else { c.state = 'idle'; c.aph += d * 5; }
  } else {
    const hx = p.x - p.face * 26, hy = p.y + 8;
    const dx = hx - c.x, dy = hy - c.y;
    if (Math.abs(dx) > 12 || Math.abs(dy) > 8) {
      const sp = c.spd * 80; c.x += clamp(dx / 14, -1, 1) * sp * d; c.y += clamp(dy / 10, -1, 1) * sp * .5 * d;
      c.face = dx > 0 ? 1 : -1; c.state = 'walk'; c.aph += d * 12;
    } else { c.state = 'idle'; c.aph += d * 4; c.face = p.face; }
  }
  c.cd = Math.max(0, c.cd - d); c.rush = Math.max(0, c.rush - d);
  c.y = clamp(c.y, GY0, GY1);
  if (c.render === 'wing' || c.render === 'float') c.z = 16 + Math.sin(T * 3) * 3;
}
function mount() {

function enemyStrike(e) {

  if (companion) targets.push(companion);

    const dx = (t.x - e.x) * e.face;
    if (dx > -12 && dx < e.reach + 6 && Math.abs(t.y - e.y) < 20 && Math.abs(t.z - e.z) < 34) {

    }

}
function updEnemy(e, d) {
  e.flash = Math.max(0, e.flash - d);
  if (e.dying) { e.dying -= d * 1.5; if (e.dying <= 0) e.remove = 1; e.y += 0; return; }
  if (e.stun > 0) { e.stun -= d; }
  if (e.kbx) { e.x += e.kbx * d; e.kbx *= .84; if (Math.abs(e.kbx) < 4) e.kbx = 0; }
  if (e.z > 0 || e.vz) { e.vz -= 420 * d; e.z += e.vz * d; if (e.z <= 0 && e.render !== 'wing' && e.render !== 'float') { e.z = 0; e.vz = 0; } }
  if (e.hurtT > 0) { e.hurtT -= d; e.state = 'hurt'; return; }
  if (e.stun > 0) { e.state = 'idle'; return; }

  const p = player;
  if (e.dodge) {
    e.dodgeT = (e.dodgeT || 0) - d;
    if (e.dodgeT <= 0 && p.atkT > 0 && Math.abs(e.x - p.x) < 48) {
      e.dodgeT = 1.5; e.y = clamp(e.y + (Math.random() < .5 ? -15 : 15), GY0, GY1);
      burst(e.x, e.y, 0, 5, '#cfe7ff', 34, 'spark');
    }
  }
  let tgt = p;
  if (companion && dist(e, companion) < dist(e, p) * .7) tgt = companion;
  const dx = tgt.x - e.x, dy = tgt.y - e.y;
  e.face = dx > 0 ? 1 : -1;
  e.cd = Math.max(0, e.cd - d);

  if (e.atkT > 0) {
    e.atkT -= d;
    if (!e.hitDone && e.atkT < e.atkDur * .45) {
      e.hitDone = 1;
      if (e.proj && (e.ai === 'ranged' || e.ai === 'flyer' || e.ai === 'bomber' || e.ai === 'boss_ranged' || e.ai === 'boss_fly' || (e.ai === 'boss_mix' && e.phase === 1)))
        fire(e, e.proj, tgt.x, tgt.y, e.atk * (PROJ[e.proj] ? PROJ[e.proj].dmg : 1), 'e');
      else enemyStrike(e);
    }
    if (e.atkT <= 0) { e.state = 'idle'; e.cd = e.boss ? rnd(.5, 1.1) : rnd(.7, 1.8); e.tele = 0; }
    return;
  }

  const sp = e.spd * 66;
  const melee = e.ai === 'melee' || e.ai === 'charger' || e.ai === 'boss_melee' || e.ai === 'boss_charge' || (e.ai === 'boss_mix' && e.phase === 0);
  const wantX = melee ? e.reach - 6 : (e.ai === 'bomber' ? 74 : 62);

  if (melee) {
    if (Math.abs(dx) > wantX || Math.abs(dy) > 10) {
      let rush = 1;
      if ((e.ai === 'charger' || e.ai === 'boss_charge') && Math.abs(dx) < 120 && Math.abs(dy) < 14) {
        if (e.tele < .45) { e.tele += d; e.state = 'idle'; return; }
        rush = 2.4;
      }
      e.x += Math.sign(dx) * sp * rush * d;
      e.y += clamp(dy / 12, -1, 1) * sp * .55 * d;
      e.state = rush > 1.5 ? 'run' : 'walk'; e.aph += d * (rush > 1.5 ? 18 : 10);
    } else if (e.cd <= 0) {
      e.state = 'atk'; e.atkDur = e.boss ? .58 : .48; e.atkT = e.atkDur; e.hitDone = 0; e.tele = 0;
    } else { e.state = 'idle'; e.aph += d * 4; }
  } else {
    /* ranged / flyer / bomber keep a lane and shoot */
    const far = Math.abs(dx) > wantX + 26, close = Math.abs(dx) < wantX - 20;
    if (far) { e.x += Math.sign(dx) * sp * d; e.state = 'walk'; e.aph += d * 10; }
    else if (close) { e.x -= Math.sign(dx) * sp * .9 * d; e.state = 'walk'; e.aph += d * 10; }
    else if (Math.abs(dy) > 12) { e.y += clamp(dy / 12, -1, 1) * sp * .5 * d; e.state = 'walk'; e.aph += d * 9; }
    else if (e.cd <= 0) { e.state = 'cast'; e.atkDur = .55; e.atkT = e.atkDur; e.hitDone = 0; }
    else { e.state = 'idle'; e.aph += d * 4; }
    if (e.render === 'wing' || e.render === 'float') e.z = 17 + Math.sin(T * 2.2 + e.seed) * 5;
  }

  /* boss phase flipping */
  if (e.boss) {
    e.phase = (Math.floor(T / 5) % 2);
    if (e.ai === 'boss_fly') e.z = 18 + Math.sin(T * 1.6 + e.seed) * 9;
    if (e.hp < e.maxhp * .45 && !e.enraged) {
      e.enraged = 1; e.spd *= 1.3; e.atk = Math.round(e.atk * 1.15);
      addText(e.x, e.y - e.h - 20, 'ENRAGED', '#ff4a4a', 1); shake = 10; flashScreen = .25;
    }
  }
  e.y = clamp(e.y, GY0, GY1);
  if (gateLocked) e.x = clamp(e.x, camX - 30, camX + W + 30);
}

/* separation so bodies do not stack into one pixel */
function separate() {
  for (let i = 0; i < enemies.length; i++) {
    const a = enemies[i]; if (a.dying) continue;
    for (let j = i + 1; j < enemies.length; j++) {
      const b = enemies[j]; if (b.dying) continue;
      const dx = b.x - a.x, dy = b.y - a.y;
      if (Math.abs(dx) < 13 && Math.abs(dy) < 9) {
        const push = (13 - Math.abs(dx)) * .18 * (dx >= 0 ? 1 : -1);
        a.x -= push; b.x += push;
        a.y -= (dy >= 0 ? .4 : -.4); b.y += (dy >= 0 ? .4 : -.4);
      }
    }
  }
}

/* ============================================================
   PROJECTILES / PARTICLES / DROPS
   ============================================================ */
function updProjs(d) {
  projs.forEach(pr => {
    pr.t += d; pr.x += pr.vx * d; pr.y += pr.vy * d;
    if (pr.arc) pr.vz -= 200 * d;
    pr.z += pr.vz * d;
    if (pr.pull) {
      pr.vx *= .985;
      enemies.forEach(e => { if (!e.dying && Math.abs(e.x - pr.x) < 60 && Math.abs(e.y - pr.y) < 34) { e.x += Math.sign(pr.x - e.x) * 42 * d; e.y += Math.sign(pr.y - e.y) * 22 * d; } });
      if (pr.t > .1) { pr.tick = (pr.tick || 0) + d; if (pr.tick > .22) { pr.tick = 0; enemies.forEach(e => { if (!e.dying && Math.abs(e.x - pr.x) < 26 && Math.abs(e.y - pr.y) < 22) hurtEnemy(e, pr.dmg, 0, 'player', 0); }); } }
    }
    if (pr.owner === 'p') {
      enemies.forEach(e => {
        if (e.dying || pr.dead) return;
        if (Math.abs(e.x - pr.x) < 12 + pr.r && Math.abs(e.y - pr.y) < 14 && Math.abs((e.z + e.h * .4) - pr.z) < 40) {
          if (!pr.pull) { pr.dead = 1; hurtEnemy(e, pr.dmg, pr.vx > 0 ? 50 : -50, 'player', 0); burst(pr.x, pr.y, pr.z, 6, pr.c, 40, 'spark'); }
        }
      });
    } else {
      const list = companion ? [player, companion] : [player];
      list.forEach(t => {
        if (pr.dead) return;
        if (Math.abs(t.x - pr.x) < 11 + pr.r && Math.abs(t.y - pr.y) < 13 && Math.abs((t.z + t.h * .4) - pr.z) < 40) {
          pr.dead = 1;
          if (pr.boom) { burst(pr.x, pr.y, pr.z, 16, '#ff8a3c', 80, 'spark'); shake = 6; }
          if (t.isP) hurtPlayer(pr.dmg); else hurtCompanion(pr.dmg);
        }
      });
    }
    if (pr.arc && pr.z <= 0) {
      pr.dead = 1;
      if (pr.boom) {
        burst(pr.x, pr.y, 2, 20, '#ff8a3c', 90, 'spark'); shake = 5;
        [player].concat(companion ? [companion] : []).forEach(t => {
          if (Math.abs(t.x - pr.x) < 30 && Math.abs(t.y - pr.y) < 22) { if (t.isP) hurtPlayer(pr.dmg * .8); else hurtCompanion(pr.dmg * .8); }
        });
      }
    }

}
function updParts(d) {
  parts.forEach(p => {
    p.t += d; p.x += p.vx * d; p.y += p.vy * d; p.z += p.vz * d;
    if (p.kind !== 'beam') p.vz -= 210 * d;
    if (p.z < 0) { p.z = 0; p.vz *= -.35; }
  });
  parts = parts.filter(p => p.t < p.life);
  texts.forEach(t => { t.t += d; t.y -= 22 * d; });
  texts = texts.filter(t => t.t < t.life);
  drops.forEach(o => { o.t += d; o.vz -= 200 * d; o.z += o.vz * d; if (o.z <= 0) { o.z = 0; o.vz = 0; } });

/* ============================================================
   STAGE FLOW
   ============================================================ */
function startStage(i) {
  stageIdx = i; const S = STAGES[i];
  enemies = []; projs = []; parts = []; drops = []; texts = [];
  camX = 0; waveIdx = 0; gateLocked = false; bossUp = null; stageClearT = 0;
  player.x = 50; player.y = 222; player.z = 0; player.state = 'idle'; player.dying = 0;
  if (companion) { companion.x = 24; companion.y = 230; }
  S.gates = S.waves.map((w, k) => 220 + k * ((S.len - W - 320) / Math.max(1, S.waves.length - 1)));
  buildProps(S); omen = null; tandem = null; player.riding = 0;

  mode = 'play';
}
function spawnWave(list) {

  list.forEach((k, i) => {
    const side = i % 2 ? 1 : -1;
    const x = side > 0 ? camX + W + 20 + i * 16 : camX - 24 - i * 16;
    const e = mkEnemy(k, x, rnd(GY0 + 6, GY1 - 4), boost);
    if (omen) omen.apply(e);

  });
  gateLocked = true;
  banner = omen ? { a: omen.name, b: omen.desc, t: 0, omenB: 1 }

}
function updStage(d) {
  const S = STAGES[stageIdx];
  const alive = enemies.filter(e => !e.dying).length;

  if (!gateLocked && !bossUp) {
    if (waveIdx < S.waves.length && camX >= S.gates[waveIdx] - 40) { spawnWave(S.waves[waveIdx]); waveIdx++; }
    else if (waveIdx >= S.waves.length && camX >= S.len - W - 10) {

      enemies.push(bossUp); gateLocked = true;
      banner = { a: bossUp.name, b: 'WARDEN OF ' + S.name, t: 0, boss: 1 };
      shake = 10;
    }
  }
  if (gateLocked && alive === 0) {
    if (bossUp) {
      stageClearT += d;
      if (stageClearT > 2.2) {
        score += 2000 + player.lvl * 100;
        if (stageIdx >= STAGES.length - 1) { mode = 'win'; return; }
        mode = 'camp'; selRoster = roster.length ? selRoster : 0;
      }
    } else { gateLocked = false; omen = null; banner = { a: 'GO', b: '', t: 0, small: 1 }; }
  }
  /* camera */
  const want = gateLocked ? camX : clamp(player.x - W * .38, 0, S.len - W);
  camX += (want - camX) * Math.min(1, d * 5);
  camX = clamp(camX, 0, S.len - W);
  enemies = enemies.filter(e => !e.remove);
  props = props.filter(o => !o.dead);
}

    else if (cmdCd > 0) text('WAIT ' + Math.ceil(cmdCd), 174, 70, '#ff9a5a', 10, 'right');
    else text('[I] SEND', 174, 70, '#ffd23c', 10, 'right');
  } else if (roster.length) {
    panel(4, 46, 176, 20, 'rgba(232,221,198,.35)');
    text('[I] CALL A BEAST', 12, 51, '#e8ddc6', 10, 'left');
  }

  /* tandem gauge -- the signature strip */
  if (companion) {
    const full = bondG >= BOND_MAX;
    bar(8, 90, 168, 8, bondG, BOND_MAX, full ? (Math.floor(T * 8) % 2 ? '#ffd23c' : '#ff8a3c') : '#a06cff');
    if (full) text('TANDEM READY  [I]', 92, 91, '#160f22', 10, 'center');
    else text('TANDEM ' + Math.floor(bondG) + '%', 12, 91, 'rgba(232,221,198,.85)', 10, 'left');
  }

  /* right column */
  text(String(score).padStart(7, '0'), W - 6, 6, '#ffd23c', 16, 'right');
  text(STAGES[stageIdx].name, W - 6, 26, '#e8ddc6', 10, 'right', 200);
  text('BONDED ' + roster.length + '/8', W - 6, 38, '#7ef0c2', 10, 'right');
  if (omen) text(omen.name, W - 6, 50, '#ff9a5a', 10, 'right');
  if (combo > 1) text(combo + ' CHAIN', W - 6, omen ? 64 : 52, combo > 6 ? '#ff8a3c' : '#e8ddc6', combo > 6 ? 20 : 14, 'right');

  /* boss bar */
  if (bossUp && !bossUp.remove && bossUp.hp > 0) {
    text(bossUp.name, W / 2, H - 28, '#ff6a6a', 12, 'center');
    bar(W / 2 - 120, H - 14, 240, 8, bossUp.hp, bossUp.maxhp, '#c2352f');
  }
  if (!gateLocked && !bossUp) {
    const a = Math.sin(T * 5) * 3;
    text('>>', W - 26 + a, H - 42, '#ffd23c', 20, 'center');
  }

  /* banner */
  if (banner) {
    banner.t += dt;
    const k = banner.t, dur = banner.small ? 1.1 : 2.6;
    if (k > dur) banner = null;
    else {
      const al = clamp(Math.min(k * 4, (dur - k) * 4), 0, 1);
      ctx.globalAlpha = al;
      const accent = banner.boss ? '#c2352f' : banner.omenB ? '#a06cff' : '#ffd23c';
      if (!banner.small) { R(0, 100, W, 48, 'rgba(11,9,16,.86)'); R(0, 100, W, 2, accent); R(0, 146, W, 2, accent); }
      text(banner.a, W / 2, banner.small ? 112 : 108, banner.boss ? '#ff6a6a' : accent, banner.small ? 20 : 24, 'center', W - 24);
      if (banner.b) text(banner.b, W / 2, 132, '#e8ddc6', 10, 'center', W - 24);
      ctx.globalAlpha = 1;
    }
  }
}

/* ============================================================
   SCREENS
   ============================================================ */
let navCd = 0;
function nav() {
  if (navCd > 0) return 0;
  if (IN.x < -.4) { navCd = .22; SFX.ui(); return -1; }
  if (IN.x > .4) { navCd = .22; SFX.ui(); return 1; }
  return 0;
}
function navY() {
  if (navCd > 0) return 0;
  if (IN.y < -.4) { navCd = .22; SFX.ui(); return -1; }
  if (IN.y > .4) { navCd = .22; SFX.ui(); return 1; }
  return 0;
}
function panel(x, y, w, h, accent) {
  R(x, y, w, h, 'rgba(11,9,16,.82)');
  R(x, y, w, 1, accent); R(x, y + h - 1, w, 1, accent);
  R(x, y, 1, h, accent); R(x + w - 1, y, 1, h, accent);
}

function scrTitle() {
  drawBG('volcano');
  ctx.fillStyle = 'rgba(11,9,16,.55)'; ctx.fillRect(0, 0, W, H);
  /* demo brawl silhouettes */
  const demo = [
    { render: 'biped', pal: HEROES[0].pal, build: HEROES[0].build, wep: 'katana', h: 30, x: 150, y: 200, state: 'atk', atkT: (T % 1) * .3, atkDur: .3, face: 1, z: 0, aph: T * 8 },
    { render: 'quad', pal: BEAST.direwolf.pal, build: { fangs: 1 }, h: 22, x: 210, y: 208, state: 'run', atkT: 0, atkDur: 1, face: -1, z: 0, aph: T * 14 },
    { render: 'wing', pal: BEAST.dragon.pal, big: 1, h: 30, x: 300, y: 190, state: 'idle', atkT: 0, atkDur: 1, face: -1, z: 30, aph: T * 6, seed: 2 },
    { render: 'blob', pal: BEAST.slime.pal, h: 18, x: 120, y: 214, state: 'idle', atkT: 0, atkDur: 1, face: 1, z: 0, seed: 1 }
  ];
  const oldCam = camX; camX = 0;
  demo.forEach(e => drawActor(e, T)); camX = oldCam;

  text('BEASTBOUND', W / 2, 30, '#c2352f', 30, 'center');
  text('BEASTBOUND', W / 2 - 2, 28, '#ffd23c', 30, 'center');
  text('BLADES OF THE HOLLOW MARCH', W / 2, 62, '#e8ddc6', 12, 'center');
  panel(40, 84, W - 80, 68, '#7ef0c2');
  text('BEAT A BEAST DOWN, TAKE ITS EMBER, FIGHT BESIDE IT', W / 2, 90, '#7ef0c2', 10, 'center', W - 96);
  text('RIDE YOUR BEAST INTO THE LINE', W / 2, 104, '#e8ddc6', 10, 'center');
  text('FILL THE BOND GAUGE FOR A TANDEM ARTE', W / 2, 118, '#e8ddc6', 10, 'center');
  text('HOLLOW OMENS TWIST EVERY WAVE', W / 2, 132, '#e8ddc6', 10, 'center');
  text('8 MARCHERS   20 BEASTS   7 MARCHES', W / 2, 158, '#ffd23c', 12, 'center');
  if (Math.floor(T * 2) % 2) text('PRESS ATTACK OR ENTER TO BEGIN', W / 2, 186, '#ffd23c', 14, 'center');
  text('J ATTACK   K JUMP AND RIDE   L ARTE   I BEAST', W / 2, H - 20, 'rgba(232,221,198,.6)', 10, 'center');
  if (tapAny()) { mode = 'select'; SFX.ui(); }
}

function scrSelect() {
  drawBG('keep');
  ctx.fillStyle = 'rgba(11,9,16,.62)'; ctx.fillRect(0, 0, W, H);
  text('CHOOSE YOUR MARCHER', W / 2, 4, '#ffd23c', 16, 'center');

  const COLS = 4, CW = 118, CH = 64, OX = 2, OY = 22;
  const nx = nav(), ny = navY();
  if (nx) {
    const row = Math.floor(selHero / COLS), col = (selHero % COLS + nx + COLS) % COLS;
    selHero = Math.min(HEROES.length - 1, row * COLS + col);
  }
  if (ny) {
    const rows = Math.ceil(HEROES.length / COLS);
    const col = selHero % COLS, row = (Math.floor(selHero / COLS) + ny + rows) % rows;
    selHero = Math.min(HEROES.length - 1, row * COLS + col);
  }

  HEROES.forEach((hh, i) => {
    const col = i % COLS, row = Math.floor(i / COLS);
    const cx = OX + col * CW, cy = OY + row * (CH + 6), on = i === selHero;
    panel(cx, cy, CW - 6, CH, on ? '#ffd23c' : 'rgba(232,221,198,.22)');
    if (on) R(cx + 1, cy + 1, CW - 8, CH - 2, 'rgba(194,53,47,.16)');
    ctx.save(); ctx.translate(cx + (CW - 6) / 2, cy + 46); ctx.scale(on ? 1.55 : 1.25, on ? 1.55 : 1.25);
    drawBiped({ render: 'biped', pal: hh.pal, build: hh.build, wep: hh.wep, h: hh.h,
      state: on ? 'idle' : 'idle', aph: T * 4 + i, face: 1, z: 0, atkT: 0, atkDur: 1 }, T);
    ctx.restore();
    text(hh.short, cx + (CW - 6) / 2, cy + 51, on ? '#ffd23c' : 'rgba(232,221,198,.7)', 12, 'center', CW - 10);
  });

  const h = HEROES[selHero];
  panel(6, 154, W - 12, 62, '#c2352f');
  text(h.name, W / 2, 158, '#e8ddc6', 14, 'center', W - 24);
  text(h.blurb, W / 2, 176, 'rgba(232,221,198,.85)', 10, 'center', W - 20);
  text('HP ' + h.hp + '   ARTE ' + h.mp + '   ATK ' + h.atk + '   REACH ' + h.reach, W / 2, 190, '#e8ddc6', 10, 'center');
  text('ARTE  ' + h.arteName + '  (' + h.arteCost + ')', W / 2, 202, '#8fc4ff', 12, 'center', W - 20);
  const perk = h.key === 'beastmaster' ? 'PERK: EVERY BONDED BEAST CARRIES 35% MORE HEALTH'
    : h.ranged ? 'PERK: FIRES AT RANGE WHEN NOTHING IS IN REACH'
      : 'PERK: THIRD HIT OF THE CHAIN LAUNCHES ENEMIES';
  text(perk, W / 2, 222, '#7ef0c2', 10, 'center', W - 20);
  text('ARROWS BROWSE     ATTACK TO MARCH OUT', W / 2, 240, '#ffd23c', 12, 'center');

  if (tapA() || (IN.enter && !IN.penter)) {
    player = mkPlayer(HEROES[selHero]); roster = []; companion = null;
    score = 0; combo = 0; startStage(0); SFX.level();
  }
}

function scrCamp() {
  drawBG(STAGES[stageIdx].theme);
  ctx.fillStyle = 'rgba(11,9,16,.72)'; ctx.fillRect(0, 0, W, H);
  text('STAGE ' + (stageIdx + 1) + ' CLEARED', W / 2, 8, '#ffd23c', 20, 'center');
  text('CAMP. PICK WHO MARCHES AT YOUR SIDE.', W / 2, 30, '#e8ddc6', 10, 'center');

  panel(10, 40, W - 20, 96, '#7ef0c2');
  if (!roster.length) {
    text('NO BONDS YET. FINISH BEASTS OFF AND GRAB THE EMBER THEY DROP.', W / 2, 84, '#e8ddc6', 10, 'center', W - 40);
  } else {
    const n = nav(); if (n) selRoster = (selRoster + n + roster.length) % roster.length;
    const perRow = 8, ox = W / 2 - (Math.min(roster.length, perRow) * 52) / 2;
    roster.forEach((s, i) => {
      const b = BEAST[s.key], x = ox + i * 52 + 26, on = i === selRoster;
      if (on) panel(x - 24, 46, 48, 84, '#ffd23c');
      ctx.save(); ctx.translate(x, 104); ctx.scale(on ? 1.5 : 1.2, on ? 1.5 : 1.2);
      (RENDERERS[b.render] || drawBiped)({ render: b.render, pal: b.pal, build: b.build || {}, wep: b.wep || 'none', h: b.h, big: b.big, state: 'idle', aph: T * 4 + i, face: 1, z: 0, atkT: 0, atkDur: 1, seed: i }, T);
      ctx.restore();
      text('LV' + s.lvl, x, 110, on ? '#ffd23c' : 'rgba(232,221,198,.7)', 10, 'center');
      bar(x - 20, 120, 40, 4, s.hp, s.maxhp, '#5fbf8f');
    });
    const s = roster[selRoster], b = BEAST[s.key], bd = BOND[s.key] || { role: 'ALLY', note: '' };
    panel(10, 140, W - 20, 46, '#c2352f');
    text(b.name + '  [' + bd.role + ']', W / 2, 146, '#e8ddc6', 12, 'center', W - 30);
    text(bd.note, W / 2, 162, '#e8ddc6', 10, 'center', W - 30);
    text('HP ' + s.hp + '/' + s.maxhp + '   ATK ' + Math.round(b.atk * 1.15 + s.lvl * 2.2) + '   BOND LV' + s.lvl, W / 2, 174, '#8fc4ff', 10, 'center');
  }
  text('ARROWS CHOOSE    [L] REST AND HEAL ALL    ATTACK MARCH ON', W / 2, 196, '#ffd23c', 10, 'center', W - 16);
  text('STAND NEXT TO YOUR BEAST AND PRESS JUMP TO RIDE IT', W / 2, 208, '#7ef0c2', 10, 'center', W - 16);
  text(player.def.short + ' LV' + player.lvl + '   HP ' + Math.round(player.hp) + '/' + player.maxhp + '   SCORE ' + score, W / 2, 220, '#e8ddc6', 10, 'center');
  const nxt = STAGES[stageIdx + 1];
  text(nxt ? 'NEXT: ' + nxt.name : 'THE MARCH IS DONE', W / 2, 234, '#7ef0c2', 12, 'center', W - 20);

  if (tapC()) {
    player.hp = player.maxhp; player.mp = player.maxmp;
    roster.forEach(s => { s.hp = s.maxhp; s.down = 0; });
    addText(0, 0, '', '#fff'); SFX.level();
  }
  if (tapA() || (IN.enter && !IN.penter)) {
    if (roster.length) summon(selRoster);
    player.hp = Math.min(player.maxhp, player.hp + Math.round(player.maxhp * .35));
    if (STAGES[stageIdx + 1]) startStage(stageIdx + 1); else mode = 'win';
  }
}

function scrEnd(win) {
  drawBG(win ? 'forest' : 'keep');
  ctx.fillStyle = 'rgba(11,9,16,.78)'; ctx.fillRect(0, 0, W, H);
  text(win ? 'THE MARCH ENDS' : 'YOU FELL', W / 2, 30, win ? '#ffd23c' : '#c2352f', 30, 'center', W - 20);
  text(win ? 'CINDERMAW IS ASH. THE HOLLOW MARCH IS YOURS.' : 'THE MARCH BREAKS. THE WILDS CLOSE BACK IN.', W / 2, 64, '#e8ddc6', 10, 'center', W - 20);
  panel(50, 84, W - 100, 100, '#7ef0c2');
  text('SCORE  ' + score, W / 2, 92, '#ffd23c', 20, 'center');
  text((player ? player.def.short : '-') + '  LV' + (player ? player.lvl : 1) + '   STAGE ' + (stageIdx + 1) + '/' + STAGES.length, W / 2, 114, '#e8ddc6', 12, 'center');
  text('BEASTS BONDED  ' + roster.length + ' / 17', W / 2, 132, '#7ef0c2', 12, 'center');
  const rows = [];
  roster.forEach((s2, i) => { const r = Math.floor(i / 3); rows[r] = (rows[r] ? rows[r] + '   ' : '') + BEAST[s2.key].name + ' LV' + s2.lvl; });
  if (!rows.length) rows.push('NONE');
  rows.slice(0, 3).forEach((r, i) => text(r, W / 2, 150 + i * 12, 'rgba(232,221,198,.85)', 10, 'center', W - 110));
  if (Math.floor(T * 2) % 2) text('PRESS ATTACK TO RETURN TO TITLE', W / 2, 208, '#ffd23c', 14, 'center');
  if (tapAny()) { mode = 'title'; enemies = []; parts = []; projs = []; drops = []; SFX.ui(); }
}

/* ============================================================
   PLAY RENDER
   ============================================================ */
function drawPlay() {
  const S = STAGES[stageIdx];
  ctx.save();
  if (shake > .2) ctx.translate(rnd(-shake, shake) * .5, rnd(-shake, shake) * .5);
  drawBG(S.theme);
  drops.forEach(drawDrop);
  let cast = [player].concat(companion ? [companion] : []).concat(enemies)
    .concat(props.filter(o => !o.dead && o.x > camX - 40 && o.x < camX + W + 40));
  cast.sort((a2, b2) => a2.y - b2.y);
  if (player.riding) { cast = cast.filter(e => e !== player); cast.push(player); }
  cast.forEach(e => drawActor(e, T));
  projs.forEach(drawProj);
  parts.forEach(drawPart);
  texts.forEach(t => {
    ctx.globalAlpha = clamp(1 - t.t / t.life, 0, 1);
    text(t.s, t.x - camX, t.y, t.c, t.big ? 14 : 10, 'center');
    ctx.globalAlpha = 1;
  });
  /* ride prompt */
  if (companion && !player.riding && !tandem && Math.abs(companion.x - player.x) < 26 && Math.abs(companion.y - player.y) < 18) {
    text('[JUMP] RIDE', companion.x - camX, companion.y - companion.h - 26 + Math.sin(T * 6) * 2, '#ffd23c', 10, 'center');
  }
  drawFG(S.theme);
  ctx.restore();
  if (omen) { ctx.fillStyle = omen.tint; ctx.fillRect(0, 0, W, H); }
  if (flashScreen > 0) { ctx.fillStyle = 'rgba(255,240,200,' + (flashScreen * .6) + ')'; ctx.fillRect(0, 0, W, H); }
  if (tandem) drawTandem();
  drawHUD();
}

/* the tag-team cut-in: hero on the left, bonded beast on the right */
function drawTandem() {
  const k = clamp(tandem.t * 5, 0, 1), out = clamp((tandem.dur - tandem.t) * 5, 0, 1), a = Math.min(k, out);
  ctx.fillStyle = 'rgba(11,9,16,' + (.5 * a) + ')'; ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = a;
  const slideL = -140 + 140 * k, slideR = 140 - 140 * k;
  R(0, 64, W, 84, 'rgba(11,9,16,.6)');
  R(0, 64, W, 2, '#ffd23c'); R(0, 146, W, 2, '#ffd23c');
  ctx.save(); ctx.translate(96 + slideL, 142); ctx.scale(2.4, 2.4);
  drawBiped({ render: 'biped', pal: player.pal, build: player.build, wep: player.wep, h: player.h, state: 'atk', atkT: .1, atkDur: .3, aph: T * 8, face: 1, z: 0 }, T);
  ctx.restore();
  if (companion) {
    ctx.save(); ctx.translate(W - 96 + slideR, 142); ctx.scale(2.2, 2.2);
    const gc = Object.assign({}, companion, { state: 'atk', atkT: .1, atkDur: .3, aph: T * 8, face: -1, z: 0 });
    (RENDERERS[companion.render] || drawBiped)(gc, T); ctx.restore();
  }
  text('TANDEM ARTE', W / 2, 74, '#ffd23c', 24, 'center', W - 40);
  text(tandem.name, W / 2, 100, '#e8ddc6', 12, 'center', W - 40);
  text('x' + tandem.hits, W / 2, 122, '#ff8a3c', 20, 'center');
  ctx.globalAlpha = 1;
}

/* ============================================================
   LOOP
   ============================================================ */
function step(ts) {
  requestAnimationFrame(step);
  if (!last) last = ts;
  dt = Math.min(.05, (ts - last) / 1000); last = ts;
  T += dt;
  readInput();
  navCd = Math.max(0, navCd - dt);
  shake = Math.max(0, shake - dt * 26);
  flashScreen = Math.max(0, flashScreen - dt * 1.4);
  comboT = Math.max(0, comboT - dt); if (comboT <= 0) combo = 0;

  if (mode === 'play') {
    if (hitstop > 0) { hitstop -= dt; }
    else if (tandem) { updTandem(dt); updParts(dt); updStage(dt); }
    else {
      const d = dt;
      cmdCd = Math.max(0, cmdCd - d);
      roster.forEach(s => { if (s.down > 0) { s.down -= d; if (s.down <= 0) s.hp = Math.max(1, Math.round(s.maxhp * .6)); } });
      /* beast button: tap = command, hold = swap */
      if (IN.d) { holdD += d; if (holdD > .5 && !IN.swapped) { IN.swapped = 1; if (player.riding) dismount(1); if (roster.length > 1) summon(selRoster + 1); else if (roster.length && !companion) summon(0); } }
      else {
        if (holdD > 0 && holdD <= .5) {
          if (companion && bondG >= BOND_MAX) startTandem();
          else if (!companion && roster.length) summon(selRoster);
          else commandBeast();
        }
        holdD = 0; IN.swapped = 0;
      }
      updPlayer(d); updCompanion(d);
      enemies.forEach(e => updEnemy(e, d));
      separate(); updProjs(d); updParts(d); updStage(d);
    }
    drawPlay();
  }
  else if (mode === 'title') scrTitle();
  else if (mode === 'select') scrSelect();
  else if (mode === 'camp') { updParts(dt); scrCamp(); }
  else if (mode === 'over') scrEnd(false);
  else if (mode === 'win') scrEnd(true);
}
requestAnimationFrame(step);
</script>
